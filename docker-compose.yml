# Infra local de dev: Postgres + Redis (portas deslocadas p/ não bater com o the-logic-lab).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: decrypter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
