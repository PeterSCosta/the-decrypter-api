# Stack dedicada (Dokploy). Postgres 17 + Redis 7 PRIVADOS ao the-decrypter-api.
# Os serviços têm nomes ÚNICOS (decrypter-db / decrypter-cache) de propósito: a
# API fica também na `logiclabnetwork` (p/ o Traefik), onde o the-logic-lab já tem
# serviços `postgres`/`redis` — nomes genéricos colidiriam e a API resolveria o DNS
# para o banco errado. Schema via initdb + reaplicado pelo sidecar (idempotente).
services:
  decrypter-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: decrypter
      POSTGRES_USER: postgres
      # A justificativa antiga do `trust` era "dados públicos numa rede isolada".
      # Ela caiu quando `app_user` passou a guardar hash de senha: qualquer
      # contêiner que entre na decrypter-internal lê a tabela sem credencial.
      #
      # Defina POSTGRES_PASSWORD no Dokploy para ligar a senha. ATENÇÃO: em
      # volume JÁ INICIALIZADO isto não basta — o `pg_hba.conf` mora dentro do
      # volume e continua em `trust`. Ver DEPLOY.md §"Ligar senha no Postgres"
      # para o passo manual, que é uma linha de SQL e um reload.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
    volumes:
      - decrypter-pgdata-v3:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d decrypter"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [decrypter-internal]

  decrypter-cache:
    image: redis:7-alpine
    restart: always
    # Sem requirepass: cache de dados públicos numa rede interna isolada.
    command: ["redis-server", "--save", "60", "1000"]
    volumes:
      - decrypter-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [decrypter-internal]

  # Sidecar one-shot: reaplica schema.sql (idempotente) e roda o seeder. Sai 0.
  # `service_completed_successfully` na API garante que ninguém é roteado antes.
  decrypter-api-seed:
    image: petercosta/the-decrypter-api:latest
    pull_policy: always
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -f /app/db/schema.sql
        dotnet TheDecrypter.Api.dll seed --data /app/data
    environment:
      ConnectionStrings__DecrypterDB: "Host=decrypter-db;Port=5432;Database=decrypter;Username=postgres;Password=${POSTGRES_PASSWORD:-}"
      PGHOST: decrypter-db
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: decrypter
      # O `psql` do sidecar ignora a connection string do .NET.
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      # Sem Jwt__SigningKey de propósito: o modo seed roda o schema e sai, e a
      # validação da chave no Program.cs pula quando o argumento é `seed`. Se um
      # dia ela passar a valer para todos os modos, o seed quebra aqui primeiro.
    depends_on:
      decrypter-db: { condition: service_healthy }
    networks: [decrypter-internal]

  decrypter-api:
    image: petercosta/the-decrypter-api:latest
    pull_policy: always
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DecrypterDB: "Host=decrypter-db;Port=5432;Database=decrypter;Username=postgres;Password=${POSTGRES_PASSWORD:-}"
      ConnectionStrings__Redis: "decrypter-cache:6379"
      AllowedOrigins__0: ${ALLOWED_ORIGIN:-https://arromba.thelogiclab.com.br}
      Gateways__Cnpj__BaseUrl: ${CNPJ_BASE_URL:-https://brasilapi.com.br/api/}
      Gateways__Cnpj__RatePerMinute: ${CNPJ_RATE_PER_MINUTE:-3}
      Gateways__What3Words__Key: ${W3W_API_KEY:-}
      # Reconhecimento de música (audd.io). Vazio = o recurso aparece na tela e
      # responde "não configurado", em vez de fingir que não reconheceu — são
      # coisas diferentes e levam a ações opostas. A cota gratuita é de ~300
      # requisições que NÃO renovam, e é por isso que quem escolhe o trecho a
      # enviar é a pessoa, não uma varredura automática.
      Gateways__Audd__Token: ${AUDD_TOKEN:-}
      Gateways__Nominatim__UserAgent: ${NOMINATIM_USER_AGENT:-TheDecrypter/1.0 (+https://arromba.thelogiclab.com.br)}
      # Frota (Traccar self-hosted). Vazio = aba Frota desativada (lista vazia).
      # Ex.: https://traccar.thelogiclab.com.br  +  token read-only do Traccar.
      Traccar__BaseUrl: ${TRACCAR_BASE_URL:-}
      Traccar__Token: ${TRACCAR_TOKEN:-}
      # Login. A API SE RECUSA A SUBIR com a chave abaixo de 32 bytes — é de
      # propósito: chave curta só estoura no primeiro login, com a API
      # aparentemente saudável. Gere com `openssl rand -base64 48`.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY}
      Jwt__HorasDeValidade: ${JWT_HORAS:-12}
      # Admin inicial, criado no boot se ainda não existir. Sem ele a base
      # zerada trava: todo cadastro nasce pendente e só um admin aprova.
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Senha: ${ADMIN_SENHA:-}
      # Opcional. Sem ela nada muda: o admin continua entrando pelo e-mail.
      # Definindo, o admin que JÁ existe ganha o apelido (busca pelo e-mail
      # primeiro), sem virar uma segunda conta.
      Admin__Apelido: ${ADMIN_APELIDO:-}
    depends_on:
      decrypter-db: { condition: service_healthy }
      decrypter-cache: { condition: service_healthy }
      decrypter-api-seed: { condition: service_completed_successfully }
    networks: [decrypter-internal, logiclabnetwork]
    # Labels do Traefik são injetadas pelo painel Domain do Dokploy.

networks:
  decrypter-internal:
    driver: bridge
    internal: true            # bloqueia egress do PG/Redis para a internet
  logiclabnetwork:
    name: logiclabnetwork
    external: true

volumes:
  decrypter-pgdata-v3:
  decrypter-redisdata:
